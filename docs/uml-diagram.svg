<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" font-family="Consolas, Monaco, monospace" font-size="12">
  <rect width="1100" height="710" fill="#ffffff"/>
  <defs>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#222" stroke-width="1.5"/>
    </marker>
    <marker id="triangle-hollow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
    </marker>
    <marker id="diamond-hollow" viewBox="0 0 14 10" refX="0" refY="5" markerWidth="12" markerHeight="9" orient="auto">
      <path d="M 0 5 L 7 1 L 14 5 L 7 9 Z" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- ConsoleApp -->
  <g transform="translate(30, 30)">
    <rect width="320" height="150" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="32" x2="320" y2="32" stroke="#334155" stroke-width="1.2"/>
    <line x1="0" y1="74" x2="320" y2="74" stroke="#334155" stroke-width="1.2"/>
    <text x="160" y="21" text-anchor="middle" font-weight="bold" font-size="13">ConsoleApp</text>
    <text x="10" y="50">- {static} tasks : List&lt;Task&gt;</text>
    <text x="10" y="66">- {static} storage : TaskStorage</text>
    <text x="10" y="92">+ {static} main(args : String[]) : void</text>
    <text x="10" y="108">- {static} viewTasks(list : List&lt;Task&gt;) : void</text>
    <text x="10" y="124">- {static} addWorkTask(sc : Scanner) : void</text>
    <text x="10" y="140">- {static} filterByPriority(sc : Scanner) : void</text>
  </g>

  <!-- PriorityFilter -->
  <g transform="translate(415, 30)">
    <rect width="285" height="115" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="32" x2="285" y2="32" stroke="#334155" stroke-width="1.2"/>
    <line x1="0" y1="58" x2="285" y2="58" stroke="#334155" stroke-width="1.2"/>
    <text x="142" y="21" text-anchor="middle" font-weight="bold" font-size="13">PriorityFilter</text>
    <text x="10" y="49">- minPriority : int</text>
    <text x="10" y="76">+ PriorityFilter(minPriority : int)</text>
    <text x="10" y="94">+ matches(task : Task) : boolean</text>
  </g>

  <!-- TaskFilterStrategy -->
  <g transform="translate(765, 30)">
    <rect width="305" height="115" fill="#f0fdf4" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="44" x2="305" y2="44" stroke="#334155" stroke-width="1.2"/>
    <text x="152" y="18" text-anchor="middle" font-style="italic" font-size="11">&lt;&lt;interface&gt;&gt;</text>
    <text x="152" y="35" text-anchor="middle" font-weight="bold" font-size="13">TaskFilterStrategy</text>
    <text x="10" y="68">+ matches(task : Task) : boolean</text>
  </g>

  <!-- Task (Abstract) -->
  <g transform="translate(30, 245)">
    <rect width="330" height="225" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="44" x2="330" y2="44" stroke="#334155" stroke-width="1.2"/>
    <line x1="0" y1="114" x2="330" y2="114" stroke="#334155" stroke-width="1.2"/>
    <text x="165" y="18" text-anchor="middle" font-style="italic" font-size="11">&lt;&lt;abstract&gt;&gt; (Comparable&lt;Task&gt;)</text>
    <text x="165" y="35" text-anchor="middle" font-weight="bold" font-style="italic" font-size="13">Task</text>
    <text x="10" y="60">- id : String</text>
    <text x="10" y="76">- title : String</text>
    <text x="10" y="92">- priority : int</text>
    <text x="10" y="108">- completed : boolean</text>
    <text x="10" y="132">+ Task(id: String, title: String, priority: int)</text>
    <text x="10" y="148">+ getId() : String / + getTitle() : String</text>
    <text x="10" y="164">+ getPriority() : int / + isCompleted() : boolean</text>
    <text x="10" y="180">+ setCompleted(completed : boolean) : void</text>
    <text x="10" y="196" font-style="italic">+ {abstract} calculatePriorityScore() : int</text>
    <text x="10" y="212">+ compareTo(other : Task) : int</text>
  </g>

  <!-- TaskStorage -->
  <g transform="translate(765, 210)">
    <rect width="305" height="145" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="32" x2="305" y2="32" stroke="#334155" stroke-width="1.2"/>
    <line x1="0" y1="58" x2="305" y2="58" stroke="#334155" stroke-width="1.2"/>
    <text x="152" y="21" text-anchor="middle" font-weight="bold" font-size="13">TaskStorage</text>
    <text x="10" y="49">- filePath : String</text>
    <text x="10" y="76">+ TaskStorage(filePath : String)</text>
    <text x="10" y="94">+ loadTasks() : List&lt;Task&gt;</text>
    <text x="10" y="112">+ saveTasks(tasks : List&lt;Task&gt;) : void</text>
    <text x="10" y="130">+ getNextAvailableId(tasks : List&lt;Task&gt;) : String</text>
  </g>

  <!-- InvalidTaskDataException -->
  <g transform="translate(765, 430)">
    <rect width="305" height="95" fill="#fef2f2" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="44" x2="305" y2="44" stroke="#334155" stroke-width="1.2"/>
    <text x="152" y="18" text-anchor="middle" font-style="italic" font-size="11">&lt;&lt;exception&gt;&gt; (extends Exception)</text>
    <text x="152" y="35" text-anchor="middle" font-weight="bold" font-size="13">InvalidTaskDataException</text>
    <text x="10" y="68">+ InvalidTaskDataException(message : String)</text>
  </g>

  <!-- WorkTask -->
  <g transform="translate(30, 550)">
    <rect width="340" height="130" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="32" x2="340" y2="32" stroke="#334155" stroke-width="1.2"/>
    <line x1="0" y1="58" x2="340" y2="58" stroke="#334155" stroke-width="1.2"/>
    <text x="170" y="21" text-anchor="middle" font-weight="bold" font-size="13">WorkTask</text>
    <text x="10" y="49">- projectCode : String</text>
    <text x="10" y="76">+ WorkTask(id, title, priority, projectCode)</text>
    <text x="10" y="94">+ getProjectCode() : String</text>
    <text x="10" y="112">+ calculatePriorityScore() : int</text>
  </g>

  <!-- PersonalTask -->
  <g transform="translate(410, 550)">
    <rect width="340" height="130" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="32" x2="340" y2="32" stroke="#334155" stroke-width="1.2"/>
    <line x1="0" y1="58" x2="340" y2="58" stroke="#334155" stroke-width="1.2"/>
    <text x="170" y="21" text-anchor="middle" font-weight="bold" font-size="13">PersonalTask</text>
    <text x="10" y="49">- urgent : boolean</text>
    <text x="10" y="76">+ PersonalTask(id, title, priority, urgent)</text>
    <text x="10" y="94">+ isUrgent() : boolean</text>
    <text x="10" y="112">+ calculatePriorityScore() : int</text>
  </g>

  <!-- Relationships -->
  <!-- ConsoleApp o-- Task (Aggregation 1 to 0..*) -->
  <line x1="190" y1="180" x2="190" y2="245" stroke="#222" stroke-width="1.5" marker-start="url(#diamond-hollow)"/>
  <text x="174" y="198">1</text>
  <text x="164" y="236">0..*</text>
  <text x="198" y="216" font-size="11">manages</text>

  <!-- ConsoleApp ..> PriorityFilter -->
  <line x1="350" y1="85" x2="415" y2="85" stroke="#222" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
  <text x="364" y="77" font-size="11">uses</text>

  <!-- PriorityFilter ..|> TaskFilterStrategy -->
  <line x1="700" y1="85" x2="765" y2="85" stroke="#222" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#triangle-hollow)"/>

  <!-- ConsoleApp --> TaskStorage (Association 1 to 1) -->
  <polyline points="350,162 560,162 560,265 765,265" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow-open)"/>
  <text x="358" y="155">1</text>
  <text x="748" y="258">1</text>
  <text x="568" y="218" font-size="11">uses</text>

  <!-- WorkTask --|> Task -->
  <line x1="160" y1="550" x2="160" y2="470" stroke="#222" stroke-width="1.5" marker-end="url(#triangle-hollow)"/>

  <!-- PersonalTask --|> Task -->
  <polyline points="580,550 580,510 230,510 230,470" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#triangle-hollow)"/>

  <!-- Task ..> InvalidTaskDataException -->
  <line x1="360" y1="450" x2="765" y2="450" stroke="#222" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
  <text x="530" y="442" font-size="11">throws</text>

  <!-- TaskStorage ..> InvalidTaskDataException -->
  <line x1="917" y1="355" x2="917" y2="430" stroke="#222" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
  <text x="925" y="396" font-size="11">throws</text>
</svg>
